[package]
name = "readyproof"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Audit a git repository for open-source security and compliance readiness. Offline Rust CLI."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/readyproof"
homepage = "https://github.com/printemps-tokyo/readyproof"
readme = "README.md"
keywords = ["security", "compliance", "openssf", "sbom", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "readyproof"
path = "src/main.rs"

[lib]
name = "readyproof"
path = "src/lib.rs"

[dependencies]
# Error context for the thin binary layer (org convention).
anyhow = "1"
# Argument parsing (derive API, org convention).
clap = { version = "4", features = ["derive"] }
# gitignore-aware directory walk, same crate repotome uses.
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
